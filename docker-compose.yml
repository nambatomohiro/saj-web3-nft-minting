# SAJ Web3 NFT ハンズオン(設計書§5)
#
# 参加者導線:
#   cp .env.example .env         # Part4(Amoy)まで追随する人のみ記入
#   docker compose up            # ローカルチェーン(Hardhat node)起動
#   docker compose exec hardhat <コマンド>
services:
  hardhat:
    # 事前ビルド済みイメージ(amd64/arm64)を pull して使う(設計書§5)。
    # 開発時の再ビルドは docker compose build。
    image: ghcr.io/nambatomohiro/saj-nft:latest
    build: .
    # イメージ未取得で up されたら(pull忘れ)、その場ビルドではなく pull する
    pull_policy: missing
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545" # ホストの MetaMask から localhost:8545 で接続可能に
    env_file:
      # 背骨(ローカルチェーン)は .env が無くても動くよう required: false。
      # Amoy(Part4)には SEMINAR_PRIVATE_KEY / AMOY_RPC_URL が必要。
      - path: .env
        required: false
    volumes:
      - .:/app # ソースはマウント(参加者が Solidity コードを読める)
      - /app/node_modules # イメージ焼き込みの node_modules を匿名ボリュームで保護
